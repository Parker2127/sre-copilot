{{- if .Values.secrets.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sre-copilot.fullname" . }}
  labels:
    {{- include "sre-copilot.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Empty values disable the feature: no auth / heuristic mode / log-only.
  API_KEY: {{ .Values.secrets.apiKey | quote }}
  LLM_API_KEY: {{ .Values.secrets.llmApiKey | quote }}
  SLACK_WEBHOOK_URL: {{ .Values.secrets.slackWebhookUrl | quote }}
{{- end }}
