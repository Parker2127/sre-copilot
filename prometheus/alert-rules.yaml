# Example alert rules for SRE Copilot. Apply with kube-prometheus-stack
# (PrometheusRule CRD), or adapt to plain Prometheus rule files.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sre-copilot-example-rules
  labels:
    release: kube-prometheus-stack   # match your prometheus operator release
spec:
  groups:
    - name: sre-copilot.examples
      interval: 30s
      rules:
        - alert: KubePodCrashLooping
          expr: |
            max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff", job="kube-state-metrics"}[5m]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash-looping"
            description: "Container {{ $labels.container }} has been in CrashLoopBackOff for more than 5 minutes."

        - alert: KubeDeploymentReplicasMismatch
          expr: |
            kube_deployment_spec_replicas{job="kube-state-metrics"}
              != kube_deployment_status_replicas_available{job="kube-state-metrics"}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} replicas mismatch"
            description: "Available replicas have not matched desired for 10m — rollout may be stuck."

        - alert: HttpHighErrorRate
          expr: |
            sum by (namespace, service) (rate(http_requests_total{status=~"5.."}[5m]))
              / sum by (namespace, service) (rate(http_requests_total[5m])) > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "High 5xx rate on {{ $labels.namespace }}/{{ $labels.service }}"
            description: "More than 5% of requests are failing over the last 5 minutes."

        - alert: TargetDown
          expr: up == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Prometheus target {{ $labels.job }} is down"
            description: "The target has not been scrapeable for 10m — monitoring is blind here."
